name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-build:
        # Run CI when:
        # - push: normal commits (not release-please's release commits)
        # - pull_request: normal PRs immediately, release-please PRs only after formatting
        if: >
            (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release')) ||
            (github.event_name == 'pull_request' && (!startsWith(github.head_ref, 'release-please--') || contains(github.event.head_commit.message, 'chore: sync version and format')))
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Guard against internal registry URLs in lockfile
              run: |
                  if grep -q 'apple\.com' package-lock.json; then
                      echo "::error::package-lock.json contains an internal apple.com registry/artifactory URL, which is unreachable from GitHub-hosted runners. Regenerate the lockfile against the public registry (see .github/workflows/ci.yml history for the fix)."
                      grep -n 'apple\.com' package-lock.json
                      exit 1
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20.20.2'
                  cache: 'npm'

            - name: Install dependencies
              run: |
                  verify_install() {
                      [ -x node_modules/.bin/prettier ] && npm ls --depth=0 >/dev/null 2>&1
                  }

                  npm ci
                  if verify_install; then
                      echo "Install verified (attempt 1)."
                      exit 0
                  fi

                  echo "::warning::npm ci left an incomplete install (missing prettier binary or npm ls failed) — retrying once."
                  rm -rf node_modules
                  npm ci
                  if verify_install; then
                      echo "Install verified (attempt 2)."
                      exit 0
                  fi

                  echo "::error::npm ci install still incomplete after retry."
                  npm ls --depth=0 || true
                  ls -la node_modules/.bin/prettier || true

                  latest_log=$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -1)
                  if [ -n "$latest_log" ]; then
                      echo "::group::npm debug log ($latest_log)"
                      cat "$latest_log"
                      echo "::endgroup::"
                  else
                      echo "No npm debug log found."
                  fi
                  exit 1

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Run tests
              run: npm test

            - name: Build (dev standalone)
              run: npm run build:dev

            - name: Build (production libraries)
              run: npm run build

            - name: Verify bundle sizes
              run: |
                  limit=2097152
                  entrypoint_size=$(wc -c < "dist/Toolasha.user.js")
                  if [ "$entrypoint_size" -gt "$limit" ]; then
                    echo "❌ dist/Toolasha.user.js is over 2MB limit ($entrypoint_size bytes)"
                    exit 1
                  fi
                  echo "✅ dist/Toolasha.user.js is under 2MB ($entrypoint_size bytes)"
                  for file in dist/libraries/*.js; do
                    size=$(wc -c < "$file")
                    if [ "$size" -gt "$limit" ]; then
                      echo "❌ $file is over 2MB limit ($size bytes)"
                      exit 1
                    fi
                    echo "✅ $file is under 2MB ($size bytes)"
                  done
